name: SFTI Monthly Report

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Start month MM.YYYY (e.g. 02.2026). If set without "to", the report covers exactly this one month. If both empty, the previous calendar month is used.'
        required: false
        type: string
      to:
        description: 'End month MM.YYYY (e.g. 05.2026), EXCLUSIVE. Only used together with "from". Report then covers "from" up to (but not including) "to". Leave empty for a single-month report.'
        required: false
        type: string
      push_to_wiki:
        description: 'Push the generated report to the wiki. Only for the Common API Dev Team. Scheduled (cron) runs always push automatically, regardless of this checkbox.'
        required: false
        type: boolean
        default: false
      force:
        description: 'Overwrite an existing wiki page. Default false: if a wiki page with this name already exists, the report is NOT pushed (but still provided as an action artifact). Enable to overwrite it.'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 6 1 * *'

concurrency:
  group: monthly-sfti-org-report
  cancel-in-progress: false

jobs:
  monthly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Authorize wiki push (Common API Dev Team only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_to_wiki }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SFTI_BOT_TOKEN }}
          ORG: swissfintechinnovations
          TEAM_SLUG: common-api-dev-team
          ACTOR: ${{ github.actor }}
        run: |
          echo "Checking whether '$ACTOR' may push to the wiki (team '$ORG/$TEAM_SLUG')..."
          state=$(gh api "orgs/$ORG/teams/$TEAM_SLUG/memberships/$ACTOR" --jq '.state' 2>/dev/null || true)
          if [ "$state" = "active" ]; then
            echo "Authorized: '$ACTOR' is an active member of '$ORG/$TEAM_SLUG'."
          else
            echo "::error::User '$ACTOR' is not an active member of '$ORG/$TEAM_SLUG'. Wiki push denied."
            exit 1
          fi

      - name: Checkout Wiki
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.SFTI_BOT_TOKEN }}
          repository: swissfintechinnovations/.github.wiki
          path: wiki
          persist-credentials: true

      - name: Compute previous calendar month window (UTC)
        id: dates
        shell: bash
        env:
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          from datetime import datetime, timezone, timedelta

          
          input_from = (os.environ.get("INPUT_FROM") or "").strip()
          input_to = (os.environ.get("INPUT_TO") or "").strip()

          month_pattern = re.compile(r"^(0[1-9]|1[0-2])\.(\d{4})$")

          def validate_input(value: str):
              m = month_pattern.match(value)
              if not m:
                  raise ValueError(f"Invalid month format '{value}'. Expected MM.YYYY")
              month = int(m.group(1))
              year = int(m.group(2))
              return year, month

          if input_from:
            y, m = validate_input(input_from)
            prev_month_start = datetime(y, m, 1, 0, 0, 0, tzinfo=timezone.utc)
            if input_to:
              y, m = validate_input(input_to)
              current_month_start = datetime(y, m, 1, 0, 0, 0, tzinfo=timezone.utc)
            else:
              # Only 'from' given -> report covers exactly that single month
              if m == 12:
                current_month_start = datetime(y + 1, 1, 1, 0, 0, 0, tzinfo=timezone.utc)
              else:
                current_month_start = datetime(y, m + 1, 1, 0, 0, 0, tzinfo=timezone.utc)
          elif input_to:
            raise ValueError("'to' was provided without 'from'. Please also set 'from'.")
          else:
            now = datetime.now(timezone.utc)
            current_month_start = datetime(now.year, now.month, 1, 0, 0, 0, tzinfo=timezone.utc)
            if current_month_start.month == 1:
                prev_month_start = datetime(current_month_start.year - 1, 12, 1, 0, 0, 0, tzinfo=timezone.utc)
            else:
                prev_month_start = datetime(current_month_start.year, current_month_start.month - 1, 1, 0, 0, 0, tzinfo=timezone.utc)

          prev_month_end_inclusive = current_month_start - timedelta(seconds=1)

          print(f"since={prev_month_start.strftime('%Y-%m-%dT%H:%M:%SZ')}")
          print(f"until_exclusive={current_month_start.strftime('%Y-%m-%dT%H:%M:%SZ')}")
          print(f"until_inclusive={prev_month_end_inclusive.strftime('%Y-%m-%dT%H:%M:%SZ')}")
          print(f"report_month={prev_month_start.strftime('%Y-%m')}")
          print(f"report_year={prev_month_start.strftime('%Y')}")
          print(f"report_month_num={prev_month_start.strftime('%m')}")
          print(f"report_month_name={prev_month_start.strftime('%B')}")
          PY

      - name: Show computed reporting window
        run: |
          echo "SINCE=${{ steps.dates.outputs.since }}"
          echo "UNTIL_EXCLUSIVE=${{ steps.dates.outputs.until_exclusive }}"
          echo "UNTIL_INCLUSIVE=${{ steps.dates.outputs.until_inclusive }}"
          echo "REPORT_MONTH=${{ steps.dates.outputs.report_month }}"

      - name: Generate organisation monthly report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_GRAPHQL_URL: ${{ github.server_url }}/api/graphql
          GITHUB_SERVER_URL: ${{ github.server_url }}
          ORG_NAME: swissfintechinnovations
          REPORT_REPO: swissfintechinnovations/.github
          SINCE: ${{ steps.dates.outputs.since }}
          UNTIL_EXCLUSIVE: ${{ steps.dates.outputs.until_exclusive }}
          UNTIL_INCLUSIVE: ${{ steps.dates.outputs.until_inclusive }}
          REPORT_MONTH: ${{ steps.dates.outputs.report_month }}
          REPORT_MONTH_NAME: ${{ steps.dates.outputs.report_month_name }}
          REPORT_YEAR: ${{ steps.dates.outputs.report_year }}
        run: |
          python3 .github/report/monthly_report.py
          cat reports/github_report_${{ steps.dates.outputs.report_year }}_${{ steps.dates.outputs.report_month_num }}.md

      - name: Upload Markdown report artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-report-${{ steps.dates.outputs.report_month }}
          path: reports/github_report_${{ steps.dates.outputs.report_year }}_${{ steps.dates.outputs.report_month_num }}.md
          archive: false
          retention-days: 60
          if-no-files-found: error

      - name: Upload wiki-formatted report artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-report-wiki-${{ steps.dates.outputs.report_month }}
          path: reports/github_report_wiki_${{ steps.dates.outputs.report_year }}_${{ steps.dates.outputs.report_month_num }}.md
          archive: false
          retention-days: 60
          if-no-files-found: error

      - name: Archive in wiki
        if: ${{ github.event_name == 'schedule' || inputs.push_to_wiki }}
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
          WIKI_PAGE: wiki/github_report_${{ steps.dates.outputs.report_year }}_${{ steps.dates.outputs.report_month_num }}.md
          SRC_REPORT: reports/github_report_wiki_${{ steps.dates.outputs.report_year }}_${{ steps.dates.outputs.report_month_num }}.md
          LINK_LINE: '- [github-report-${{ steps.dates.outputs.report_month }}](https://github.com/swissfintechinnovations/.github/wiki/github_report_${{ steps.dates.outputs.report_year }}_${{ steps.dates.outputs.report_month_num }})'
          COMMIT_MSG: 'added report ${{ steps.dates.outputs.report_month_num }} ${{ steps.dates.outputs.report_year }}'
        run: |
          if [ -f "$WIKI_PAGE" ] && [ "$FORCE" != "true" ]; then
            echo "::warning::Wiki page '$WIKI_PAGE' already exists and 'force' is not set. Skipping wiki push. The report is still available as an action artifact."
            exit 0
          fi

          if [ -f "$WIKI_PAGE" ]; then
            echo "Wiki page '$WIKI_PAGE' already exists -> overwriting (force=true)."
          fi

          cp "$SRC_REPORT" "$WIKI_PAGE"
          cd wiki
          # Only add the index link if it is not already present (avoids duplicates on overwrite)
          if ! grep -Fq "$LINK_LINE" Monthly-Reports.md; then
            sed -i "1i $LINK_LINE" Monthly-Reports.md
          fi
          git add .
          git config --global user.name "sfti bot"
          git config --global user.email "github-bot@common-api.ch"
          git commit -m "$COMMIT_MSG" || echo "No changes to commit"
          git push
